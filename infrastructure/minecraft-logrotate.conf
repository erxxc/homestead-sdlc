/var/log/minecraft-audit.json {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    su root root
    create 644 minecraft minecraft
    postrotate
        systemctl restart minecraft-audit
    endscript
}

# Sole owner of the nginx logs (30-day retention). The stock package config
# /etc/logrotate.d/nginx must stay deleted on the VPS — if both files claim
# these logs, logrotate errors on the duplicate and the nightly run exits 1.
# dpkg remembers the conffile deletion across nginx upgrades; the deploy
# workflow fails validation if the stock file ever reappears.
/var/log/nginx/access.log /var/log/nginx/error.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    sharedscripts
    postrotate
        nginx -s reopen
    endscript
}

/var/log/minecraft-integrity.log {
    weekly
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
    su root root
    create 644 minecraft minecraft
}

/var/log/minecraft-backup-verify.log /var/log/minecraft-backup-prune.log {
    weekly
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
    su root root
    create 644 root root
}
