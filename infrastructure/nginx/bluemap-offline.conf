server {
    server_name map.geigercapital.us;
    limit_req zone=bluemap burst=20 nodelay;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline';" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Retry-After "3600" always;

    root /var/www/minecraft-map-offline;
    error_page 503 /index.html;

    location = /index.html {
        internal;
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        return 503;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/map.geigercapital.us/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/map.geigercapital.us/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name map.geigercapital.us;
    return 301 https://$host$request_uri;
}
