# Drop-in installed by deploy as
#   /etc/systemd/system/<unit>.service.d/onfailure-alert.conf
# for units this repo does not own (logrotate, minecraft,
# minecraft-status-api, minecraft_exporter). Adds failure alerting without
# replacing the live unit file. See docs/runbooks/OPS-004.
[Unit]
OnFailure=minecraft-alert@%p.service
