global:
  resolve_timeout: 5m

route:
  receiver: operator-webhook
  group_by: [alertname, job, world]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: operator-webhook
      matchers:
        - severity="critical"
      repeat_interval: 1h

receivers:
  - name: operator-webhook
    webhook_configs:
      - url_file: /etc/parallel-works/alertmanager-webhook-url
        send_resolved: true

inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [alertname, instance, world]
