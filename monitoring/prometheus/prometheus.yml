global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: parallel_works

rule_files:
  - /opt/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:9093']

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node'
    static_configs:
      - targets: ['localhost:9100']

  - job_name: 'minecraft'
    static_configs:
      - targets: ['127.0.0.1:9225']
        labels:
          world: homestead
      - targets: ['127.0.0.1:9226']
        labels:
          world: skyfactory

  - job_name: 'loki'
    static_configs:
      - targets: ['127.0.0.1:3100']

  - job_name: 'alloy'
    static_configs:
      - targets: ['127.0.0.1:12345']

  - job_name: 'cloudflared'
    static_configs:
      - targets: ['127.0.0.1:2000']
