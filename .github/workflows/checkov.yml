name: Checkov IaC Scan
on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: bridgecrewio/checkov-action@a8664e3a0549367977f0cda990a34311835c87c0
        with:
          directory: infrastructure/
          soft_fail: true
          output_format: sarif
          output_file_path: checkov.sarif
      - uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        if: always()
        with:
          sarif_file: checkov.sarif
