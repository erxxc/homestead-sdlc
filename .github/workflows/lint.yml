name: Lint
on: [push, pull_request]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Install black
        run: pip install black
      - name: Check Python formatting
        run: black --check api/ security/ --diff
      - name: Test audit logger
        run: python -m unittest discover -s security/audit-logger -p 'test_*.py' -v
      - name: Check for CSP-blocked inline content
        run: python3 security/check-csp-inline.py site/public

      - name: Check shell syntax
        run: bash -n security/*.sh security/audit-logger/*.sh infrastructure/*.sh monitoring/uptime-kuma/*.sh
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24
        with:
          globs: 'docs/**/*.md'
